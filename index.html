<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Quiz</title>
    <link rel="icon" href="Pokeball.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="gameName">Welcome to Pokemon Quiz</h1>
    <div id="homePage">
    <p id="encouragement">Professor Oak needs your help to complete the data! Step up to the podium and show us what you know.</p>
    <button id="startGame">Start Quiz</button>
    </div>
    <div id="frame">
    <div id="progressBar">
    <div id="progressMade"></div>
    </div>
    <h2 id="questionNum">Question Number</h2>
    <br>
    <p id="question">Question will appear here</p>
    <br>
    <button id="option1" class="options">Option 1</button>
    <button id="option2" class="options">Option 2</button>
    <button id="option3" class="options">Option 3</button>
    <button id="option4" class="options">Option 4</button>
</div>
<button id="nextQuestion">Next Question</button>
<div id="result">
     <h1 id="quizComppleted">Quiz Completed</h1>
     <p id="finalScore">Your Score</p>
</div>
<button id="playAgain">Play Again</button>
    <script src="script.js"></script>
</body>
</html>
